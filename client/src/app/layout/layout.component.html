<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Clone</title>
</head>
<body>
<!-- Servers Section -->
<div class="servers">
  <app-side-bar></app-side-bar>
</div>

<!-- Channels Section -->
<div class="channels">
  <app-dm-list (friendSelected)="onFriendSelected($event)"></app-dm-list>
</div>

<!-- Chat Section -->
<div class="chat">
  <app-chat *ngIf="selectedFriend" [friend]="selectedFriend"></app-chat>
</div>
</body>
</html>
