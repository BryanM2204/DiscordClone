<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Design by foolishdeveloper.com -->
  <title>Glassmorphism login Form Tutorial in html css</title>

  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <!--Stylesheet-->

</head>
<body>
<div class="background">
  <div class="shape"></div>
  <div class="shape"></div>
</div>
<form [formGroup]="profileForm" (ngSubmit)="handleSubmit()">
  <h3>Login Here</h3>

  <label for="username">Username</label>
  <input type="text" placeholder="Username" id="username" formControlName="username">

  <label for="password">Password</label>
  <input type="password" placeholder="Password" id="password" formControlName="password">

  <div class="links">
    <span class="forgot-password">
    <a href="" title="Forgot Password" id="link-reset">Forgot Password?</a>
  </span>

    <span class="register">
    <a href="/register" title="Register User" id="link-register">Register Here!</a>
  </span>
  </div>


  <!-- Error message display -->
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <button type="submit" [disabled]="!profileForm.valid">Log In</button>
  <div class="social">
    <div class="go"><i class="fab fa-google"></i>  Google</div>
    <div class="fb"><i class="fab fa-facebook"></i>  Facebook</div>
  </div>
</form>
</body>
</html>
