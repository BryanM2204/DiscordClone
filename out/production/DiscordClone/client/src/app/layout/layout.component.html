<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Clone</title>
</head>
<body>
<!-- Servers Section -->
<div class="servers">
  <button class="direct-messages">DM</button>
  <hr class="split-line">
  <app-side-bar></app-side-bar>
</div>

<!-- Channels Section -->
<div class="channels">
  <h3>Direct Messages</h3>
  <ul>
  </ul>
</div>

<!-- Chat Section -->
<div class="chat">
  <div class="chat-header">#general</div>
  <div class="chat-messages">
    <div class="chat-message">
      <span>User1:</span> Hello there!
    </div>
    <div class="chat-message">
      <span>User2:</span> Hi! How are you?
    </div>
  </div>
  <div class="chat-input">
    <input type="text" placeholder="Type a message...">
  </div>
</div>
</body>
</html>
